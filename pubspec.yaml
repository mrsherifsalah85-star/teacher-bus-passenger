name: teacher_bus_passenger
description: Passenger app for teachers bus tracking.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  http: ^1.2.2
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/alarm.wav
